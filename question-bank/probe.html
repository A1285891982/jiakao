<!DOCTYPE html><meta charset=utf-8><body>
<pre id=out>loading...</pre><pre id=img></pre>
<script>
fetch('https://a1285891982.github.io/jiakao/question-bank/ke1.json?v=2',{cache:'no-store'})
.then(r=>r.json()).then(j=>{
  const q=j.questions[0];
  document.getElementById('out').textContent='Q1 URL: '+q.imageUrl;
  const im=new Image();
  im.onload=()=>{document.getElementById('img').textContent='IMG OK '+im.naturalWidth+'x'+im.naturalHeight;};
  im.onerror=(e)=>{document.getElementById('img').textContent='IMG FAIL';};
  im.src=q.imageUrl;
  setTimeout(()=>{if(!document.getElementById('img').textContent)document.getElementById('img').textContent='IMG PENDING(超时未决)';},8000);
}).catch(e=>{document.getElementById('out').textContent='JSON FAIL '+e;});
</script></body>
